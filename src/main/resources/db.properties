# Configuracion de la conexion JDBC.
# Por defecto se usa H2 en modo archivo (no requiere instalar un servidor).
# Para MySQL: db.driver=com.mysql.cj.jdbc.Driver
#             db.url=jdbc:mysql://localhost:3306/contagest
db.driver=org.h2.Driver
db.url=jdbc:h2:file:./data/contagest
db.usuario=sa
db.clave=
